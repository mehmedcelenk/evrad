<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Evrad</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#07080b" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <style>
    @font-face {
      font-family: "Noto Naskh Arabic";
      src: url("/fonts/NotoNaskhArabic-Regular.ttf") format("truetype");
      font-weight: 400; font-display: swap;
    }
    :root {
      color-scheme: dark; --bg: #07080b; --surface: rgba(20,22,27,0.92); --surface-soft: #12141a;
      --line: rgba(255,255,255,0.085); --line-strong: rgba(255,253,239,0.24);
      --text: #f5f2ea; --text-soft: #c8c4b9; --muted: #8d9098; --aura: rgba(255,250,220,0.22);
      --font-ar: "Noto Naskh Arabic", Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; border: 0; touch-action: manipulation; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; overflow-x: hidden; padding-bottom: 5.5rem; }
    .ambient { position: fixed; border-radius: 50%; filter: blur(75px); pointer-events: none; z-index: 0; }
    .amb-1 { top: -4rem; left: 15%; width: 14rem; height: 14rem; background: rgba(85,95,140,0.18); }
    .amb-2 { top: 25%; right: -5rem; width: 16rem; height: 16rem; background: rgba(55,115,100,0.14); }
    
    .shell { position: relative; z-index: 1; max-width: 42rem; margin: 0 auto; padding: 1.25rem 1rem; }
    header.top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .title-h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; }
    .top-end { display: flex; align-items: center; gap: 0.6rem; }
    .eyebrow { font-size: 0.88rem; color: var(--muted); font-family: "Noto Kufi Arabic", var(--font-ar); }
    .icon-btn { background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0.35rem; border-radius: 0.4rem; transition: color 0.15s; }
    .icon-btn:hover { color: var(--text); }

    /* Category bar */
    .cat-bar { display: flex; gap: 0.4rem; overflow-x: auto; padding-bottom: 0.85rem; scrollbar-width: none; }
    .cat-pill { background: var(--surface-soft); border: 1px solid var(--line); color: var(--muted); font-size: 0.78rem; padding: 0.35rem 0.75rem; border-radius: 999px; cursor: pointer; white-space: nowrap; transition: 0.15s; }
    .cat-pill.is-active { background: rgba(255,255,255,0.08); border-color: var(--line-strong); color: var(--text); }

    /* Cards */
    .card-list { display: grid; gap: 0.75rem; }
    article.card { background: linear-gradient(145deg, rgba(24,26,32,0.9), rgba(13,15,19,0.94)); border: 1px solid var(--line); border-radius: 0.95rem; box-shadow: 0 0.8rem 2.2rem -1.5rem rgba(0,0,0,0.6); transition: 0.2s; }
    article.card.is-done { border-color: var(--line-strong); box-shadow: 0 0 2rem -0.8rem var(--aura); }
    .card-row { display: grid; grid-template-columns: 2.75rem 1fr 2.75rem; align-items: center; min-height: 4.2rem; }
    .card-marker { text-align: center; font-size: 1.15rem; }
    .card-body { cursor: pointer; padding: 0.4rem 0.2rem; overflow: hidden; }
    .card-title { font-size: 0.96rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-preview-ar { font-family: var(--font-ar); direction: rtl; font-size: 0.88rem; color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 0.2rem; }
    .check-btn { display: grid; place-items: center; width: 2.4rem; height: 2.4rem; border-radius: 50%; cursor: pointer; margin: 0 auto; color: var(--muted); transition: 0.2s; }
    .check-dot { width: 1.15rem; height: 1.15rem; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.22); display: grid; place-items: center; transition: 0.2s; }
    article.card.is-done .check-dot { background: var(--text); border-color: var(--text); color: #000; box-shadow: 0 0 10px var(--aura); }
    
    /* Card detail */
    .card-details { display: none; padding: 0.4rem 1rem 0.85rem; border-top: 1px solid var(--line); font-size: 0.92rem; }
    article.card[data-open="true"] .card-details { display: block; }
    .ar-block { font-family: var(--font-ar); direction: rtl; text-align: right; font-size: calc(1.15rem * var(--f-scale, 1)); line-height: var(--f-lh, 1.8); margin: 0.75rem 0; }
    .tr-block { color: var(--text-soft); font-size: 0.86rem; line-height: 1.5; margin-bottom: 0.6rem; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 0.8rem; padding-top: 0.5rem; border-top: 1px solid rgba(255,255,255,0.05); }
    .counter-badge { font-size: 0.8rem; color: var(--muted); }

    /* Bottom bar */
    nav.bottom-bar { position: fixed; left: 50%; bottom: calc(0.85rem + env(safe-area-inset-bottom)); transform: translateX(-50%); background: rgba(18,20,25,0.96); border: 1px solid var(--line); border-radius: 0.62rem; padding: 0.35rem 0.6rem; display: flex; gap: 0.6rem; z-index: 30; box-shadow: 0 1rem 3rem rgba(0,0,0,0.6); }

    /* Dialogs */
    dialog { margin: auto; background: #13151b; color: var(--text); border: 1px solid var(--line-strong); border-radius: 1rem; padding: 1.2rem; width: min(92vw, 26rem); box-shadow: 0 2rem 5rem rgba(0,0,0,0.8); }
    dialog::backdrop { background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); }
    .dialog-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .form-group { margin-bottom: 0.85rem; }
    .form-group label { display: block; font-size: 0.76rem; color: var(--muted); text-transform: uppercase; margin-bottom: 0.3rem; letter-spacing: 0.05em; }
    input, textarea, select { width: 100%; background: var(--surface-soft); border: 1px solid var(--line); color: var(--text); padding: 0.55rem 0.75rem; border-radius: 0.5rem; font-size: 0.9rem; }
    input:focus, textarea:focus { border-color: var(--line-strong); outline: none; }
    .btn-row { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.1rem; }
    .btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.88rem; cursor: pointer; }
    .btn-primary { background: var(--text); color: #000; font-weight: 600; }
    .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text); }
    .btn-danger { background: rgba(255,80,80,0.15); color: #ff8888; }
  </style>
</head>
<body>
  <div class="ambient amb-1"></div><div class="ambient amb-2"></div>
  <main class="shell">
    <header class="top-bar">
      <h1 class="title-h1">Evrad</h1>
      <div class="top-end">
        <p class="eyebrow">Bismillah</p>
        <button class="icon-btn" id="btn-settings" title="Ayarlar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </header>

    <div class="cat-bar" id="cat-bar">
      <button class="cat-pill is-active" data-cat="all">Tümü</button>
      <button class="cat-pill" data-cat="zikir">📿 Zikir</button>
      <button class="cat-pill" data-cat="dua">🤲 Dua</button>
      <button class="cat-pill" data-cat="salavat">📜 Salavat</button>
    </div>

    <section class="card-list" id="card-list"></section>
  </main>

  <nav class="bottom-bar">
    <button class="icon-btn" id="btn-virds" title="Tümü">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 2v4"/><path d="M12 18v4"/></svg>
    </button>
    <button class="icon-btn" id="btn-add" title="Yeni Ekle">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    </button>
  </nav>

  <!-- Edit/Add Dialog -->
  <dialog id="dlg-editor">
    <div class="dialog-head"><h3 id="dlg-title">Vird Ekle</h3><button class="icon-btn" onclick="this.closest('dialog').close()">✕</button></div>
    <form id="form-item">
      <input type="hidden" id="item-id" />
      <div class="form-group"><label>Başlık *</label><input type="text" id="item-title" required /></div>
      <div class="form-group"><label>Arapça Metin</label><textarea id="item-ar" rows="3" dir="rtl" style="font-family:var(--font-ar)"></textarea></div>
      <div class="form-group"><label>Türkçe Meali / Not</label><textarea id="item-tr" rows="2"></textarea></div>
      <div class="form-group" style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem">
        <div><label>Kategori</label><select id="item-cat"><option value="zikir">Zikir</option><option value="dua">Dua</option><option value="salavat">Salavat</option></select></div>
        <div><label>Hedef Adet (Boş=∞)</label><input type="number" id="item-target" min="1" placeholder="Sınırsız" /></div>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-danger" id="btn-delete-item" style="display:none; margin-right:auto;">Sil</button>
        <button type="button" class="btn btn-secondary" onclick="this.closest('dialog').close()">İptal</button>
        <button type="submit" class="btn btn-primary">Kaydet</button>
      </div>
    </form>
  </dialog>

  <!-- Settings Dialog -->
  <dialog id="dlg-settings">
    <div class="dialog-head"><h3>Ayarlar</h3><button class="icon-btn" onclick="this.closest('dialog').close()">✕</button></div>
    <div class="form-group">
      <label>Arapça Yazı Boyutu (<span id="val-fscale">1.0</span>x)</label>
      <input type="range" id="set-fscale" min="0.8" max="1.6" step="0.05" />
    </div>
    <div class="form-group">
      <label>Satır Yüksekliği (<span id="val-flh">1.8</span>)</label>
      <input type="range" id="set-flh" min="1.4" max="2.6" step="0.1" />
    </div>
    <div class="form-group">
      <label>Gün Sıfırlama Saati</label>
      <input type="time" id="set-reset-time" value="00:00" />
    </div>
    <div class="btn-row"><button type="button" class="btn btn-primary" onclick="this.closest('dialog').close()">Tamam</button></div>
  </dialog>

  <script>
    // --- 1. CONFIG & STATE ---
    const SB_URL = "https://placeholder-url.supabase.co"; // Supabase Project URL
    const SB_KEY = "placeholder-anon-key";              // Supabase Anon Key
    const ICONS = { dhikr: "📿", dua: "🤲", salavat: "📜" };
    
    let state = {
      virds: JSON.parse(localStorage.getItem("evrad_cache") || "[]"),
      catFilter: "all",
      prefs: Object.assign({ fscale: 1.0, flh: 1.8, resetTime: "00:00" }, JSON.parse(localStorage.getItem("evrad_prefs") || "{}"))
    };

    function applyPrefs() {
      document.documentElement.style.setProperty("--f-scale", state.prefs.fscale);
      document.documentElement.style.setProperty("--f-lh", state.prefs.flh);
      localStorage.setItem("evrad_prefs", JSON.stringify(state.prefs));
    }
    applyPrefs();

    function getTodayKey() {
      const now = new Date();
      const [rH, rM] = state.prefs.resetTime.split(":").map(Number);
      const resetDate = new Date(now);
      resetDate.setHours(rH, rM, 0, 0);
      if (now < resetDate) resetDate.setDate(resetDate.getDate() - 1);
      return resetDate.toISOString().slice(0, 10);
    }

    // --- 2. SUPABASE REST API ---
    async function sbFetch(path, opts = {}) {
      if (SB_URL.includes("placeholder")) return null;
      try {
        const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
          ...opts,
          headers: { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}`, "Content-Type": "application/json", "Prefer": "return=representation", ...(opts.headers || {}) }
        });
        return res.ok ? await res.json() : null;
      } catch (e) { return null; }
    }

    async function syncVirds() {
      const data = await sbFetch("virdler?select=*&order=order_index.asc");
      if (data && Array.isArray(data)) {
        state.virds = data;
        localStorage.setItem("evrad_cache", JSON.stringify(state.virds));
        render();
      }
    }

    // --- 3. RENDER ---
    function render() {
      const today = getTodayKey();
      const listEl = document.getElementById("card-list");
      const filtered = state.catFilter === "all" ? state.virds : state.virds.filter(v => (v.category || "zikir") === state.catFilter);

      if (!filtered.length) {
        listEl.innerHTML = `<div style="text-align:center; padding:3rem 1rem; color:var(--muted)">Henüz vird eklenmemiş.<br>Alttaki <b>+</b> butonuna dokunarak ekleyin.</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(v => {
        const isDone = v.completed && v.last_completed_date === today;
        return `
          <article class="card ${isDone ? "is-done" : ""}" data-id="${v.id}" data-open="false">
            <div class="card-row">
              <div class="card-marker">${ICONS[v.category] || "📿"}</div>
              <div class="card-body" onclick="toggleExpand('${v.id}')">
                <div class="card-title">${v.title || "İsimsiz"}</div>
                ${v.arabic_text ? `<div class="card-preview-ar">${v.arabic_text}</div>` : ""}
              </div>
              <button class="check-btn" onclick="toggleCheck('${v.id}')">
                <span class="check-dot">${isDone ? "✓" : ""}</span>
              </button>
            </div>
            <div class="card-details">
              ${v.arabic_text ? `<div class="ar-block">${v.arabic_text}</div>` : ""}
              ${v.translation ? `<div class="tr-block">${v.translation}</div>` : ""}
              <div class="card-footer">
                <span class="counter-badge">Hedef: ${v.target_count || "∞"}</span>
                <button class="icon-btn" onclick="openEditor('${v.id}')" title="Düzenle">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
                </button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    // --- 4. INTERACTIONS ---
    window.toggleExpand = (id) => {
      const card = document.querySelector(`article.card[data-id="${id}"]`);
      if (card) card.setAttribute("data-open", card.getAttribute("data-open") === "true" ? "false" : "true");
    };

    window.toggleCheck = async (id) => {
      const today = getTodayKey();
      const vird = state.virds.find(v => v.id === id);
      if (!vird) return;
      const isDone = vird.completed && vird.last_completed_date === today;
      vird.completed = !isDone;
      vird.last_completed_date = !isDone ? today : "";
      vird.updated_at = new Date().toISOString();
      localStorage.setItem("evrad_cache", JSON.stringify(state.virds));
      render();
      await sbFetch(`virdler?id=eq.${id}`, { method: "PATCH", body: JSON.stringify({ completed: vird.completed, last_completed_date: vird.last_completed_date, updated_at: vird.updated_at }) });
    };

    window.openEditor = (id) => {
      const vird = state.virds.find(v => v.id === id);
      document.getElementById("dlg-title").innerText = vird ? "Virdi Düzenle" : "Yeni Vird Ekle";
      document.getElementById("item-id").value = vird ? vird.id : "";
      document.getElementById("item-title").value = vird ? vird.title : "";
      document.getElementById("item-ar").value = vird ? vird.arabic_text || "" : "";
      document.getElementById("item-tr").value = vird ? vird.translation || "" : "";
      document.getElementById("item-cat").value = vird ? (vird.category || "zikir") : "zikir";
      document.getElementById("item-target").value = (vird && vird.target_count) ? vird.target_count : "";
      document.getElementById("btn-delete-item").style.display = vird ? "block" : "none";
      document.getElementById("dlg-editor").showModal();
    };

    // --- 5. FORM & SETTINGS EVENTS ---
    document.getElementById("form-item").onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById("item-id").value || ("vird-" + Date.now());
      const item = {
        id,
        title: document.getElementById("item-title").value.trim(),
        arabic_text: document.getElementById("item-ar").value.trim(),
        translation: document.getElementById("item-tr").value.trim(),
        category: document.getElementById("item-cat").value,
        target_count: Number(document.getElementById("item-target").value) || null,
        updated_at: new Date().toISOString()
      };
      const idx = state.virds.findIndex(v => v.id === id);
      if (idx > -1) state.virds[idx] = { ...state.virds[idx], ...item };
      else { item.completed = false; item.last_completed_date = ""; state.virds.push(item); }

      localStorage.setItem("evrad_cache", JSON.stringify(state.virds));
      render();
      document.getElementById("dlg-editor").close();
      await sbFetch("virdler", { method: "POST", headers: { "Prefer": "resolution=merge-duplicates" }, body: JSON.stringify(item) });
    };

    document.getElementById("btn-delete-item").onclick = async () => {
      const id = document.getElementById("item-id").value;
      if (!id || !confirm("Bu virdi silmek istediğinize emin misiniz?")) return;
      state.virds = state.virds.filter(v => v.id !== id);
      localStorage.setItem("evrad_cache", JSON.stringify(state.virds));
      render();
      document.getElementById("dlg-editor").close();
      await sbFetch(`virdler?id=eq.${id}`, { method: "DELETE" });
    };

    // Settings
    document.getElementById("btn-settings").onclick = () => {
      document.getElementById("set-fscale").value = state.prefs.fscale;
      document.getElementById("val-fscale").innerText = state.prefs.fscale;
      document.getElementById("set-flh").value = state.prefs.flh;
      document.getElementById("val-flh").innerText = state.prefs.flh;
      document.getElementById("set-reset-time").value = state.prefs.resetTime;
      document.getElementById("dlg-settings").showModal();
    };
    document.getElementById("set-fscale").oninput = (e) => { state.prefs.fscale = Number(e.target.value); document.getElementById("val-fscale").innerText = e.target.value; applyPrefs(); };
    document.getElementById("set-flh").oninput = (e) => { state.prefs.flh = Number(e.target.value); document.getElementById("val-flh").innerText = e.target.value; applyPrefs(); };
    document.getElementById("set-reset-time").onchange = (e) => { state.prefs.resetTime = e.target.value || "00:00"; applyPrefs(); render(); };

    // Buttons & Filters
    document.getElementById("btn-add").onclick = () => openEditor(null);
    document.getElementById("btn-virds").onclick = () => { state.catFilter = "all"; updateCatPills(); render(); };
    document.querySelectorAll(".cat-pill").forEach(btn => {
      btn.onclick = () => { state.catFilter = btn.dataset.cat; updateCatPills(); render(); };
    });
    function updateCatPills() {
      document.querySelectorAll(".cat-pill").forEach(b => b.classList.toggle("is-active", b.dataset.cat === state.catFilter));
    }

    // --- 6. MIGRATION FROM INDEXEDDB (ONE-TIME) ---
    async function migrateFromIndexedDB() {
      if (localStorage.getItem("migration_done")) return;
      try {
        const req = indexedDB.open("zikirlerim");
        req.onsuccess = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains("dhikr")) return;
          const tx = db.transaction("dhikr", "readonly");
          const store = tx.objectStore("dhikr");
          const getAll = store.getAll();
          getAll.onsuccess = () => {
            const legacyItems = getAll.result || [];
            if (legacyItems.length > 0 && state.virds.length === 0) {
              state.virds = legacyItems.map((item, i) => ({
                id: item.id || ("vird-" + i),
                title: item.title || "İsimsiz",
                arabic_text: item.arabicText || item.arabic_text || "",
                translation: item.translation || "",
                category: item.category || "zikir",
                target_count: item.targetCount || item.target_count || null,
                completed: false,
                last_completed_date: "",
                updated_at: new Date().toISOString()
              }));
              localStorage.setItem("evrad_cache", JSON.stringify(state.virds));
              render();
            }
            localStorage.setItem("migration_done", "true");
          };
        };
      } catch (e) { localStorage.setItem("migration_done", "true"); }
    }

    // Init
    migrateFromIndexedDB();
    render();
    syncVirds();
  </script>
</body>
</html>
