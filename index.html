<!DOCTYPE html>
<!--
================================================================================
AI AGENT / GEMINI CODING RULES & ARCHITECTURE GUIDE (AGENTS.MD)
================================================================================
1. CORE PHILOSOPHY:
   - Zero-Build, No-Framework, 100% Native Single-File Architecture (index.html).
   - NEVER introduce NPM packages, external build tools, Vite, or bundle steps.
   - Offline-First: All persistent data lives in localStorage via deterministic Store.

2. STRICT 4-LAYER STRUCTURE (DO NOT CROSS BOUNDARIES):
   - Layer 1: CSS TOKENS & ATOMS (Use defined variables: --bg, --surface, --line,
     --line-strong, --text, --muted, --aura, --font-ar. Avoid arbitrary inline styles).
   - Layer 2: STORE & REPOSITORY (Deterministic state mutations & localStorage saves.
     Store.state is the single source of truth; never mutate state outside Store).
   - Layer 3: UI RENDERERS (Pure template string functions: renderCards, renderFilters,
     renderSettings. They only read state and produce DOM strings).
   - Layer 4: ACTIONS & DISPATCHER (window.Actions contains all user handlers.
     Event listeners dispatch into Actions; Actions mutate Store and trigger renders).

3. DATA ITEM SCHEMA (VIRD):
   {
     id: string, title: string, arabic_text?: string, translation?: string,
     details?: string, source?: string, category?: string,
     target_count?: number|null, target_unit?: string, card_font_level?: number(0..4),
     completed: boolean, last_completed_date: string, updated_at?: string
   }

4. UX & DESIGN INTEGRITY:
   - Preserve smooth spring accordion animations (grid-template-rows 0fr -> 1fr).
   - Preserve Arabic typography controls (+/- size, Naskh & Google Font switcher).
   - Unified Category system: User can type custom categories or add via (+) without
     closing modals.
================================================================================
-->
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Evrad</title>
  <!-- Google Fonts for Arabic Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@400;600&family=Noto+Naskh+Arabic:wght@400;700&family=Readex+Pro:wght@400;600&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. CSS TOKENS & RESET
       ========================================================================== */
    :root {
      color-scheme: dark;
      --bg: #07080b;
      --surface: rgba(20, 22, 27, 0.88);
      --surface-elevated: #17191f;
      --surface-soft: #101217;
      --line: rgba(255, 255, 255, 0.085);
      --line-strong: rgba(255, 253, 239, 0.22);
      --text: #f5f2ea;
      --text-soft: #c8c4b9;
      --muted: #8d9098;
      --muted-deep: #676a72;
      --aura: rgba(255, 250, 220, 0.24);
      --danger: #ff9b98;
      --shadow: rgba(0, 0, 0, 0.48);
      --font-ar: "Noto Naskh Arabic", Arial, sans-serif;
      --motion-normal: 260ms;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; border: 0; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; overflow-x: hidden; padding-bottom: 6rem;
    }
    .ambient { position: fixed; border-radius: 50%; filter: blur(75px); pointer-events: none; z-index: 0; }
    .amb-1 { top: -4rem; left: 15%; width: 14rem; height: 14rem; background: rgba(85,95,140,0.18); }
    .amb-2 { top: 25%; right: -5rem; width: 16rem; height: 16rem; background: rgba(55,115,100,0.14); }
    .shell { position: relative; z-index: 1; max-width: 44rem; margin: 0 auto; padding: 1.25rem 1rem; }

    /* ==========================================================================
       2. HEADER & UNIFIED CATEGORY FILTER BAR
       ========================================================================== */
    header.top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.15rem; }
    .title-h1 { font-size: 1.65rem; font-weight: 700; letter-spacing: -0.02em; }
    .top-end { display: flex; align-items: center; gap: 0.75rem; }
    .eyebrow { font-size: 0.95rem; color: var(--muted); font-family: "Noto Kufi Arabic", var(--font-ar); }
    .icon-btn {
      background: transparent; color: var(--muted); cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center; padding: 0.35rem; border-radius: 0.4rem; transition: color 0.15s;
    }
    .icon-btn:hover { color: var(--text); }
    .filter-wrap { margin-bottom: 1.15rem; }
    .cat-bar { display: flex; gap: 0.45rem; overflow-x: auto; padding-bottom: 0.5rem; scrollbar-width: none; }
    .cat-pill {
      background: var(--surface-soft); border: 1px solid var(--line); color: var(--muted);
      font-size: 0.82rem; padding: 0.4rem 0.85rem; border-radius: 999px; cursor: pointer;
      white-space: nowrap; transition: 0.15s; display: inline-flex; align-items: center; gap: 0.35rem;
    }
    .cat-pill.is-active { background: rgba(255,255,255,0.08); border-color: var(--line-strong); color: var(--text); }

    /* ==========================================================================
       3. CARDS & ACCORDION (SMOOTH SPRING MOTION)
       ========================================================================== */
    .card-list { display: grid; gap: 0.75rem; }
    article.trackable-card {
      position: relative; border: 1px solid var(--line); border-radius: 0.95rem;
      background: linear-gradient(145deg, rgba(24, 26, 32, 0.9), rgba(13, 15, 19, 0.94));
      box-shadow: 0 1.1rem 2.8rem -2rem var(--shadow); transition: border-color 0.2s, box-shadow 0.2s;
    }
    article.trackable-card.is-complete {
      border-color: var(--line-strong); box-shadow: 0 0 2.8rem -1.15rem rgba(255, 252, 232, 0.25), 0 1.1rem 2.8rem -2rem var(--shadow);
    }
    .card-top-badges {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.75rem 0.95rem 0.2rem; min-height: 1.8rem;
    }
    .card-badge-marker { font-size: 0.82rem; color: var(--text-soft); }
    .target-chip {
      font-size: 0.72rem; color: var(--muted); border: 1px solid var(--line);
      padding: 0.15rem 0.5rem; border-radius: 999px; background: rgba(255,255,255,0.03);
    }
    .card-collapsed-row {
      display: grid; grid-template-columns: 2.75rem minmax(0, 1fr) 2.75rem;
      align-items: center; min-height: 4.1rem;
    }
    .card-main {
      border: 0; background: transparent; color: inherit; text-align: left;
      cursor: pointer; padding: 0.25rem 0.35rem; overflow: hidden;
    }
    .card-title {
      font-size: 0.98rem; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-preview-arabic {
      font-family: var(--font-ar); direction: rtl; font-size: 0.9rem; color: var(--text-soft);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 0.25rem;
    }
    .completion-light {
      display: grid; place-items: center; width: 2.75rem; height: 2.75rem;
      border: 0; background: transparent; cursor: pointer; margin: 0 auto;
    }
    .completion-core {
      width: 1.25rem; height: 1.25rem; border-radius: 0.35rem; border: 1.5px solid rgba(255, 255, 255, 0.25);
      display: grid; place-items: center; transition: 0.2s;
    }
    article.trackable-card.is-complete .completion-core {
      background: #ffffff; border-color: #ffffff; color: #000000; box-shadow: 0 0 12px var(--aura);
    }

    /* Accordion Grid Animation */
    .accordion {
      display: grid; grid-template-rows: 0fr; overflow: hidden;
      transition: grid-template-rows var(--motion-normal) var(--ease-out);
    }
    article.trackable-card[data-open="true"] .accordion { grid-template-rows: 1fr; }
    .accordion-inner { min-height: 0; overflow: hidden; }
    .card-expanded-content {
      margin: 0 0.85rem 0.85rem; padding: 0.4rem 0.4rem 0.2rem; border-top: 1px solid var(--line);
    }
    .font-controls { display: flex; align-items: center; justify-content: flex-end; gap: 0.5rem; margin: 0.3rem 0 0.6rem; }
    .detail-block { padding: 0.75rem 0.2rem; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .detail-label {
      color: var(--muted-deep); font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.35rem;
    }
    .arabic-text {
      font-family: var(--font-ar); direction: rtl; text-align: right;
      line-height: var(--f-lh, 1.8); white-space: pre-wrap; word-break: normal;
    }
    .translation-text { color: var(--text-soft); font-size: 0.92rem; line-height: 1.6; }
    .details-copy { font-size: 0.88rem; color: var(--muted); line-height: 1.5; white-space: pre-line; }
    .source-copy { font-size: 0.82rem; color: #7f828a; font-style: italic; }
    .card-actions { display: flex; justify-content: flex-end; gap: 0.75rem; padding: 0.75rem 0.25rem 0.25rem; }

    /* ==========================================================================
       4. BOTTOM NAVIGATION & SCREENS
       ========================================================================== */
    nav.bottom-navigation {
      position: fixed; left: 50%; bottom: calc(0.85rem + env(safe-area-inset-bottom));
      transform: translateX(-50%); background: rgba(18, 20, 25, 0.96); border: 1px solid var(--line);
      border-radius: 0.62rem; padding: 0.34rem 0.6rem; display: flex; gap: 0.65rem; z-index: 35;
      box-shadow: 0 1rem 3.5rem rgba(0,0,0,0.5);
    }
    .bottom-btn {
      min-width: 2.75rem; min-height: 2.75rem; border: 0; background: transparent; color: var(--muted);
      border-radius: 0.5rem; display: grid; place-items: center; cursor: pointer; transition: 0.15s;
    }
    .bottom-btn:hover { color: var(--text); }
    .bottom-btn.is-active { color: var(--text); background: rgba(255,255,255,0.06); }
    .screen-view { display: none; }
    .screen-view.is-visible { display: block; }

    /* ==========================================================================
       5. SETTINGS SCREEN
       ========================================================================== */
    .settings-stack { display: flex; flex-direction: column; gap: 1.4rem; }
    .settings-flat-group { display: flex; flex-direction: column; }
    .settings-flat-row {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      min-height: 3.4rem; padding: 0.5rem 0.2rem; border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }
    .settings-flat-label { font-size: 0.95rem; font-weight: 500; color: var(--text); }
    .settings-slider-wrap { display: flex; align-items: center; justify-content: flex-end; width: min(100%, 12.5rem); }
    .settings-slider { width: 100%; height: 2.5rem; background: transparent; cursor: pointer; outline: none; -webkit-appearance: none; }
    .settings-slider::-webkit-slider-runnable-track { width: 100%; height: 4px; border-radius: 999px; background: rgba(255, 255, 255, 0.16); }
    .settings-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 1.25rem; height: 1.25rem; margin-top: -8px; border-radius: 999px;
      background: #a0a0a0; border: 2px solid var(--surface); box-shadow: 0 0 10px rgba(255, 255, 255, 0.15); cursor: pointer;
    }
    .classic-checkbox-box {
      width: 1.25rem; height: 1.25rem; border-radius: 0.3rem; border: 1.5px solid rgba(255, 255, 255, 0.28);
      background: transparent; display: flex; align-items: center; justify-content: center; color: #000; cursor: pointer; transition: 0.15s;
    }
    .classic-checkbox-box.is-checked { border-color: #fff; background: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.25); }
    .settings-time-input {
      min-height: 2.75rem; padding: 0.35rem 0.75rem; border: 1px solid var(--line);
      border-radius: 0.65rem; background: rgba(255, 255, 255, 0.04); color: var(--text-soft); font-size: 1.02rem; font-weight: 550; outline: none; cursor: pointer;
    }
    .font-row-list { display: flex; flex-direction: column; margin-top: 0.8rem; }
    .font-row-item {
      display: flex; align-items: center; justify-content: space-between; gap: 0.85rem;
      width: 100%; min-height: 3.25rem; padding: 0.65rem 0.2rem; border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      background: transparent; color: var(--text); text-align: left; cursor: pointer;
    }
    .font-row-item.is-selected .font-row-name { color: #ffffff; }
    .font-row-name { font-size: 0.94rem; font-weight: 550; color: var(--text-soft); }
    .font-row-style { font-size: 0.72rem; color: var(--muted-deep); }
    .font-row-sample { font-size: clamp(1.2rem, 4.2vw, 1.38rem); line-height: 1; color: var(--text-soft); direction: rtl; }

    /* ==========================================================================
       6. DIALOGS & INPUTS
       ========================================================================== */
    dialog {
      margin: auto; background: #13151b; color: var(--text); border: 1px solid var(--line-strong);
      border-radius: 1rem; padding: 1.25rem; width: min(92vw, 26rem); box-shadow: 0 2rem 5rem rgba(0,0,0,0.8);
    }
    dialog::backdrop { background: rgba(0,0,0,0.68); backdrop-filter: blur(4px); }
    .dialog-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .form-group { margin-bottom: 0.85rem; }
    .form-group label { display: block; font-size: 0.76rem; color: var(--muted); text-transform: uppercase; margin-bottom: 0.35rem; }
    input[type="text"], input[type="number"], textarea, select {
      width: 100%; background: var(--surface-soft); border: 1px solid var(--line); color: var(--text);
      padding: 0.6rem 0.75rem; border-radius: 0.5rem; font-size: 0.92rem;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--line-strong); outline: none; }
    .input-with-action { display: flex; gap: 0.4rem; }
    .input-action-btn {
      padding: 0 0.85rem; background: var(--surface-soft); border: 1px solid var(--line); color: var(--text);
      border-radius: 0.5rem; cursor: pointer; font-size: 1.1rem; transition: 0.15s;
    }
    .input-action-btn:hover { border-color: var(--line-strong); background: rgba(255,255,255,0.08); }
    .btn-row { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.2rem; }
    .btn { padding: 0.55rem 1.1rem; border-radius: 0.5rem; font-size: 0.88rem; cursor: pointer; }
    .btn-primary { background: var(--text); color: #000; font-weight: 600; }
    .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text); }
  </style>
</head>
<body>
  <div class="ambient amb-1"></div><div class="ambient amb-2"></div>
  <main class="shell">
    
    <!-- 1. VIRDLER EKRANI -->
    <div id="screen-virds" class="screen-view is-visible">
      <header class="top-bar">
        <h1 class="title-h1">Evrad</h1>
        <div class="top-end">
          <p class="eyebrow">Bismillah</p>
          <button class="icon-btn" id="btn-toggle-filters" title="Filtreler">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>
      </header>

      <div class="filter-wrap" id="filter-dropdown" style="display:none;">
        <div class="cat-bar" id="cat-filter-bar"></div>
      </div>

      <section class="card-list" id="card-list"></section>
    </div>

    <!-- 2. AYARLAR EKRANI -->
    <div id="screen-settings" class="screen-view">
      <header class="top-bar">
        <h1 class="title-h1">Ayarlar</h1>
      </header>
      <div class="settings-stack">
        <div class="settings-flat-group">
          <div class="settings-flat-row">
            <label class="settings-flat-label">Arapça Metin Boyutu</label>
            <div class="settings-slider-wrap">
              <input type="range" min="0.75" max="1.5" step="0.05" id="set-fscale" class="settings-slider" />
            </div>
          </div>
          <div class="settings-flat-row">
            <label class="settings-flat-label">Arapça Satır Yüksekliği</label>
            <div class="settings-slider-wrap">
              <input type="range" min="1.3" max="2.6" step="0.05" id="set-flh" class="settings-slider" />
            </div>
          </div>
          <div class="settings-flat-row" id="row-show-translations" style="cursor:pointer">
            <span class="settings-flat-label">Türkçe Mealleri Göster</span>
            <div class="classic-checkbox-box" id="chk-translations">✓</div>
          </div>
          <div class="settings-flat-row" id="row-show-diacritics" style="cursor:pointer">
            <span class="settings-flat-label">Harekeleri Göster</span>
            <div class="classic-checkbox-box" id="chk-diacritics">✓</div>
          </div>
          <div class="settings-flat-row" id="row-haptic" style="cursor:pointer">
            <span class="settings-flat-label">Dokunmatik Titreşim</span>
            <div class="classic-checkbox-box" id="chk-haptic">✓</div>
          </div>
          <div class="settings-flat-row">
            <label class="settings-flat-label">Gün Sıfırlama Saati</label>
            <input type="time" id="set-reset-time" class="settings-time-input" value="00:00" />
          </div>
        </div>

        <div>
          <h2 style="font-size:1.05rem; font-weight:550; margin-bottom:0.6rem;">Arapça Yazı Tipi</h2>
          <div class="font-row-list" id="font-list"></div>
        </div>

        <footer style="text-align:center; padding:1.5rem 0;">
          <a href="mailto:mehmedcelenk@gmail.com" style="color:var(--muted); font-size:0.88rem; text-decoration:none;">mehmedcelenk@gmail.com</a>
        </footer>
      </div>
    </div>
  </main>

  <!-- Alt Gezinme Barı -->
  <nav class="bottom-navigation">
    <button type="button" class="bottom-btn is-active" id="nav-virds" title="Virdlerim">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.93 4.93l2.83 2.83"/><path d="M16.24 16.24l2.83 2.83"/></svg>
    </button>
    <button type="button" class="bottom-btn" id="nav-add" title="Yeni Ekle">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    </button>
    <button type="button" class="bottom-btn" id="nav-settings" title="Ayarlar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </nav>

  <!-- Vird Ekle / Düzenle Modal -->
  <dialog id="dlg-editor">
    <div class="dialog-head">
      <h3 id="dlg-title">Vird Ekle</h3>
      <button class="icon-btn" onclick="this.closest('dialog').close()">✕</button>
    </div>
    <form id="form-item">
      <input type="hidden" id="item-id" />
      <div class="form-group"><label>Başlık *</label><input type="text" id="item-title" required /></div>
      <div class="form-group"><label>Arapça Metin</label><textarea id="item-ar" rows="3" dir="rtl" style="font-family:var(--font-ar)"></textarea></div>
      <div class="form-group"><label>Türkçe Meali</label><textarea id="item-tr" rows="2"></textarea></div>
      <div class="form-group"><label>Detay & Fazilet</label><textarea id="item-details" rows="2" placeholder="Okunma vakti veya fazileti..."></textarea></div>
      <div class="form-group"><label>Kaynak</label><input type="text" id="item-source" placeholder="Örn: Tirmizî, Daavât 89" /></div>
      
      <!-- Tekil ve Özelleştirilebilir Kategori Alanı -->
      <div class="form-group">
        <label>Kategori (Seç veya Yeni Yazıp + ile Ekle)</label>
        <div class="input-with-action">
          <input type="text" id="item-cat-input" list="cat-datalist" placeholder="Örn: 📿 Zikir, Sabah, İstiğfar..." />
          <datalist id="cat-datalist"></datalist>
          <button type="button" class="input-action-btn" id="btn-add-cat-only" title="Sadece Kategoriyi Ekle">+</button>
        </div>
      </div>

      <!-- Hedef Sayı ve Birim -->
      <div class="form-group" style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem">
        <div><label>Hedef Adet</label><input type="number" id="item-target" min="1" placeholder="Sınırsız (∞)" /></div>
        <div><label>Hedef Birimi</label><input type="text" id="item-unit" placeholder="Örn: defa, kez, sayfa" /></div>
      </div>

      <div class="btn-row">
        <button type="button" class="btn btn-secondary" onclick="this.closest('dialog').close()">İptal</button>
        <button type="submit" class="btn btn-primary">Kaydet</button>
      </div>
    </form>
  </dialog>

  <script>
    /* ==========================================================================
       LAYER 1: DATA STORE & REPOSITORY
       ========================================================================== */
    const FONT_SCALES = ["1.55rem", "1.9rem", "2.3rem", "2.8rem", "3.3rem"];
    const FONTS = [
      { id: "noto", name: "Noto Naskh Arabic", style: "Geleneksel · Nesih", family: "Noto Naskh Arabic" },
      { id: "readex", name: "Readex Pro", style: "Modern · Yuvarlak", family: "Readex Pro" },
      { id: "almarai", name: "Almarai", style: "Yumuşak · Minimal", family: "Almarai" },
      { id: "amiri", name: "Amiri", style: "Klasik · Klasik Baskı", family: "Amiri" },
      { id: "scheherazade", name: "Scheherazade New", style: "Akıcı · Geleneksel", family: "Scheherazade New" }
    ];

    const DEFAULT_CATEGORIES = ["📿 Zikir", "🤲 Dua", "📜 Salavat", "Sabah", "Akşam"];
    const DEFAULT_DATA = [
      {
        id: "hepsini-kapsayan-dua",
        title: "Hepsini Kapsayan Dua",
        arabic_text: "اَللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ خَيْرِ مَا سَأَلَكَ مِنْهُ نَبِيُّكَ مُحَمَّدٌ، صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ، وَنَعُوذُ بِكَ مِنْ شَرِّ مَا اسْتَعَاذَ مِنْهُ نَبِيُّكَ مُحَمَّدٌ، صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ، وَأَنْتَ الْمُسْتَعَانُ، وَعَلَيْكَ الْبَلَاغُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللهِ",
        translation: "Allahım! Peygamber’in Muhammed sallallahu aleyhi ve sellem’in senden dilediği hayırları ben de dilerim. Peygamber’in Muhammed sallallahu aleyhi ve sellem’in sana sığındığı şerlerden biz de sana sığınırız.",
        details: "Sabah ve akşam okunabilecek dualar.",
        source: "Tirmizî, Daavât 89",
        category: "🤲 Dua",
        target_count: null,
        target_unit: "",
        card_font_level: 2,
        completed: false,
        last_completed_date: ""
      }
    ];

    const Store = {
      state: {
        activeTab: "virds",
        catFilter: "all",
        categories: JSON.parse(localStorage.getItem("evrad_categories") || "null") || DEFAULT_CATEGORIES,
        virds: JSON.parse(localStorage.getItem("evrad_virds") || "null") || DEFAULT_DATA,
        prefs: Object.assign({
          fscale: 1.0,
          flh: 1.8,
          activeFontId: "noto",
          showTranslations: true,
          showDiacritics: true,
          hapticEnabled: true,
          resetTime: "00:00"
        }, JSON.parse(localStorage.getItem("evrad_prefs") || "{}"))
      },
      save() {
        localStorage.setItem("evrad_virds", JSON.stringify(this.state.virds));
        localStorage.setItem("evrad_categories", JSON.stringify(this.state.categories));
        localStorage.setItem("evrad_prefs", JSON.stringify(this.state.prefs));
      },
      addCategory(cat) {
        const trimmed = cat.trim();
        if (trimmed && !this.state.categories.includes(trimmed)) {
          this.state.categories.push(trimmed);
          this.save();
        }
      },
      getTodayKey() {
        const now = new Date();
        const [rH, rM] = this.state.prefs.resetTime.split(":").map(Number);
        const resetDate = new Date(now);
        resetDate.setHours(rH, rM, 0, 0);
        if (now < resetDate) resetDate.setDate(resetDate.getDate() - 1);
        return resetDate.toISOString().slice(0, 10);
      }
    };

    function applyTypography() {
      document.documentElement.style.setProperty("--f-scale", Store.state.prefs.fscale);
      document.documentElement.style.setProperty("--f-lh", Store.state.prefs.flh);
      const font = FONTS.find(f => f.id === Store.state.prefs.activeFontId) || FONTS[0];
      document.documentElement.style.setProperty("--font-ar", `"${font.family}", Arial, sans-serif`);
    }
    applyTypography();

    function formatDiacritics(text) {
      if (!text || Store.state.prefs.showDiacritics) return text;
      return text.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, "");
    }

    /* ==========================================================================
       LAYER 2: UI RENDERERS (CLEAN & PURE FUNCTIONS)
       ========================================================================== */
    function renderFilters() {
      const bar = document.getElementById("cat-filter-bar");
      const datalist = document.getElementById("cat-datalist");
      
      // Update filter pills
      bar.innerHTML = `<button type="button" class="cat-pill ${Store.state.catFilter === 'all' ? 'is-active' : ''}" data-cat="all">Tümü</button>` +
        Store.state.categories.map(c => `
          <button type="button" class="cat-pill ${Store.state.catFilter === c ? 'is-active' : ''}" data-cat="${c}">${c}</button>
        `).join("");

      // Update form datalist options
      datalist.innerHTML = Store.state.categories.map(c => `<option value="${c}">`).join("");
    }

    function renderCards() {
      const today = Store.getTodayKey();
      const listEl = document.getElementById("card-list");
      const filtered = Store.state.catFilter === "all"
        ? Store.state.virds
        : Store.state.virds.filter(v => v.category === Store.state.catFilter);

      if (!filtered.length) {
        listEl.innerHTML = `<div style="text-align:center; padding:3.5rem 1rem; color:var(--muted)">Bu kategoride vird bulunmuyor.<br>Alttaki <b>+</b> butonuna dokunarak ekleyebilirsiniz.</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(v => {
        const isDone = v.completed && v.last_completed_date === today;
        const arFormatted = formatDiacritics(v.arabic_text);
        const fontLvl = v.card_font_level ?? 2;
        const targetText = v.target_count ? `${v.target_count} ${v.target_unit || ''}`.trim() : "∞";

        return `
          <article class="trackable-card ${isDone ? 'is-complete' : ''}" data-id="${v.id}" data-open="false">
            <div class="card-top-badges">
              <span class="card-badge-marker">${v.category || ''}</span>
              <span class="target-chip">${targetText}</span>
            </div>
            <div class="card-collapsed-row">
              <div style="width:2.75rem"></div>
              <button type="button" class="card-main" onclick="Actions.toggleExpand('${v.id}')">
                <h3 class="card-title">${v.title || 'İsimsiz'}</h3>
                ${arFormatted ? `<p class="card-preview-arabic">${arFormatted}</p>` : ''}
              </button>
              <button type="button" class="completion-light" onclick="Actions.toggleCheck('${v.id}')" aria-label="Tamamla">
                <span class="completion-core">${isDone ? '✓' : ''}</span>
              </button>
            </div>
            
            <div class="accordion">
              <div class="accordion-inner">
                <div class="card-expanded-content">
                  ${arFormatted ? `
                    <div class="detail-block">
                      <div class="font-controls">
                        <button type="button" class="icon-btn" onclick="Actions.changeCardFontSize('${v.id}', -1)" ${fontLvl <= 0 ? 'disabled style="opacity:0.25"' : ''} title="Yazıyı Küçült">
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
                        </button>
                        <button type="button" class="icon-btn" onclick="Actions.changeCardFontSize('${v.id}', 1)" ${fontLvl >= 4 ? 'disabled style="opacity:0.25"' : ''} title="Yazıyı Büyüt">
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                        </button>
                        <button type="button" class="icon-btn" onclick="Actions.playAudio('${v.id}')" title="Ses">
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L5.413 8.587H2.5A1.5 1.5 0 0 0 1 10.087v3.826a1.5 1.5 0 0 0 1.5 1.5h2.913l4.384 4.383A.705.705 0 0 0 11 19.298V4.702z"/><path d="M16 9a5 5 0 0 1 0 6"/></svg>
                        </button>
                      </div>
                      <div class="arabic-text" style="font-size: calc(${FONT_SCALES[fontLvl]} * var(--f-scale, 1));">${arFormatted}</div>
                    </div>
                  ` : ''}

                  ${(Store.state.prefs.showTranslations && v.translation) ? `
                    <div class="detail-block">
                      <div class="detail-label">Meal</div>
                      <div class="translation-text">${v.translation}</div>
                    </div>
                  ` : ''}

                  ${v.details ? `
                    <div class="detail-block">
                      <div class="detail-label">Fazilet & Not</div>
                      <div class="details-copy">${v.details}</div>
                    </div>
                  ` : ''}

                  ${v.source ? `
                    <div class="detail-block">
                      <div class="detail-label">Kaynak</div>
                      <div class="source-copy">${v.source}</div>
                    </div>
                  ` : ''}

                  <div class="card-actions">
                    <button type="button" class="icon-btn" onclick="Actions.openEditor('${v.id}')" title="Düzenle">
                      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
                    </button>
                    <button type="button" class="icon-btn" style="color:var(--danger)" onclick="Actions.deleteItem('${v.id}')" title="Sil">
                      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderSettings() {
      document.getElementById("set-fscale").value = Store.state.prefs.fscale;
      document.getElementById("set-flh").value = Store.state.prefs.flh;
      document.getElementById("set-reset-time").value = Store.state.prefs.resetTime;
      document.getElementById("chk-translations").innerText = Store.state.prefs.showTranslations ? "✓" : "";
      document.getElementById("chk-translations").classList.toggle("is-checked", Store.state.prefs.showTranslations);
      document.getElementById("chk-diacritics").innerText = Store.state.prefs.showDiacritics ? "✓" : "";
      document.getElementById("chk-diacritics").classList.toggle("is-checked", Store.state.prefs.showDiacritics);
      document.getElementById("chk-haptic").innerText = Store.state.prefs.hapticEnabled ? "✓" : "";
      document.getElementById("chk-haptic").classList.toggle("is-checked", Store.state.prefs.hapticEnabled);

      document.getElementById("font-list").innerHTML = FONTS.map(f => {
        const isSel = f.id === Store.state.prefs.activeFontId;
        return `
          <button type="button" class="font-row-item ${isSel ? 'is-selected' : ''}" onclick="Actions.selectFont('${f.id}')">
            <div style="display:flex; flex-direction:column; gap:0.15rem;">
              <span class="font-row-name">${f.name}</span>
              <span class="font-row-style">${f.style}</span>
            </div>
            <div style="display:flex; align-items:center; gap:0.9rem;">
              <span class="font-row-sample" style="font-family:'${f.family}'">الْحَمْدُ لِلَّهِ</span>
              <span class="classic-checkbox-box ${isSel ? 'is-checked' : ''}">${isSel ? '✓' : ''}</span>
            </div>
          </button>
        `;
      }).join("");
    }

    /* ==========================================================================
       LAYER 3: USER INTERACTIONS & DISPATCHER
       ========================================================================== */
    window.Actions = {
      toggleExpand(id) {
        const card = document.querySelector(`article.trackable-card[data-id="${id}"]`);
        if (!card) return;
        const isOpen = card.getAttribute("data-open") === "true";
        card.setAttribute("data-open", isOpen ? "false" : "true");
      },
      toggleCheck(id) {
        const today = Store.getTodayKey();
        const vird = Store.state.virds.find(v => v.id === id);
        if (!vird) return;
        if (Store.state.prefs.hapticEnabled && navigator.vibrate) navigator.vibrate(18);
        const isDone = vird.completed && vird.last_completed_date === today;
        vird.completed = !isDone;
        vird.last_completed_date = !isDone ? today : "";
        vird.updated_at = new Date().toISOString();
        Store.save();
        renderCards();
      },
      changeCardFontSize(id, delta) {
        const vird = Store.state.virds.find(v => v.id === id);
        if (!vird) return;
        const cur = vird.card_font_level ?? 2;
        vird.card_font_level = Math.max(0, Math.min(4, cur + delta));
        Store.save();
        renderCards();
      },
      playAudio(id) {
        const vird = Store.state.virds.find(v => v.id === id);
        if (vird && vird.arabic_text && 'speechSynthesis' in window) {
          const u = new SpeechSynthesisUtterance(vird.arabic_text);
          u.lang = 'ar-SA';
          window.speechSynthesis.speak(u);
        }
      },
      deleteItem(id) {
        if (!confirm("Bu virdi listeden kaldırmak istediğinize emin misiniz?")) return;
        Store.state.virds = Store.state.virds.filter(v => v.id !== id);
        Store.save();
        renderCards();
      },
      openEditor(id) {
        const vird = Store.state.virds.find(v => v.id === id);
        document.getElementById("dlg-title").innerText = vird ? "Virdi Düzenle" : "Yeni Vird Ekle";
        document.getElementById("item-id").value = vird ? vird.id : "";
        document.getElementById("item-title").value = vird ? vird.title : "";
        document.getElementById("item-ar").value = vird ? (vird.arabic_text || "") : "";
        document.getElementById("item-tr").value = vird ? (vird.translation || "") : "";
        document.getElementById("item-details").value = vird ? (vird.details || "") : "";
        document.getElementById("item-source").value = vird ? (vird.source || "") : "";
        document.getElementById("item-cat-input").value = vird ? (vird.category || "") : "";
        document.getElementById("item-target").value = (vird && vird.target_count) ? vird.target_count : "";
        document.getElementById("item-unit").value = (vird && vird.target_unit) ? vird.target_unit : "";
        document.getElementById("dlg-editor").showModal();
      },
      selectFont(id) {
        Store.state.prefs.activeFontId = id;
        applyTypography();
        Store.save();
        renderSettings();
        renderCards();
      }
    };

    /* ==========================================================================
       LAYER 4: EVENT BINDINGS
       ========================================================================== */
    // Screen Navigation
    function setTab(tab) {
      Store.state.activeTab = tab;
      document.getElementById("screen-virds").classList.toggle("is-visible", tab === "virds");
      document.getElementById("screen-settings").classList.toggle("is-visible", tab === "settings");
      document.getElementById("nav-virds").classList.toggle("is-active", tab === "virds");
      document.getElementById("nav-settings").classList.toggle("is-active", tab === "settings");
      if (tab === "settings") renderSettings(); else renderCards();
    }
    document.getElementById("nav-virds").onclick = () => setTab("virds");
    document.getElementById("nav-settings").onclick = () => setTab("settings");
    document.getElementById("nav-add").onclick = () => Actions.openEditor(null);

    // Filter Toggle & Pill Clicks
    document.getElementById("btn-toggle-filters").onclick = () => {
      const wrap = document.getElementById("filter-dropdown");
      wrap.style.display = wrap.style.display === "none" ? "block" : "none";
    };
    document.getElementById("cat-filter-bar").onclick = (e) => {
      const btn = e.target.closest(".cat-pill");
      if (!btn) return;
      Store.state.catFilter = btn.dataset.cat;
      renderFilters();
      renderCards();
    };

    // Category Quick-Add (+) Button in Modal (Does NOT close modal!)
    document.getElementById("btn-add-cat-only").onclick = () => {
      const val = document.getElementById("item-cat-input").value.trim();
      if (!val) return;
      Store.addCategory(val);
      renderFilters();
      alert(`"${val}" kategorisi eklendi.`);
    };

    // Editor Form Submit
    document.getElementById("form-item").onsubmit = (e) => {
      e.preventDefault();
      const id = document.getElementById("item-id").value || ("vird-" + Date.now());
      const catVal = document.getElementById("item-cat-input").value.trim();
      if (catVal) Store.addCategory(catVal);

      const item = {
        id,
        title: document.getElementById("item-title").value.trim(),
        arabic_text: document.getElementById("item-ar").value.trim(),
        translation: document.getElementById("item-tr").value.trim(),
        details: document.getElementById("item-details").value.trim(),
        source: document.getElementById("item-source").value.trim(),
        category: catVal,
        target_count: Number(document.getElementById("item-target").value) || null,
        target_unit: document.getElementById("item-unit").value.trim(),
        updated_at: new Date().toISOString()
      };

      const idx = Store.state.virds.findIndex(v => v.id === id);
      if (idx > -1) {
        Store.state.virds[idx] = { ...Store.state.virds[idx], ...item };
      } else {
        item.card_font_level = 2;
        item.completed = false;
        item.last_completed_date = "";
        Store.state.virds.push(item);
      }

      Store.save();
      renderFilters();
      renderCards();
      document.getElementById("dlg-editor").close();
    };

    // Settings Inputs
    document.getElementById("set-fscale").oninput = (e) => { Store.state.prefs.fscale = Number(e.target.value); applyTypography(); Store.save(); };
    document.getElementById("set-flh").oninput = (e) => { Store.state.prefs.flh = Number(e.target.value); applyTypography(); Store.save(); };
    document.getElementById("set-reset-time").onchange = (e) => { Store.state.prefs.resetTime = e.target.value || "00:00"; Store.save(); renderCards(); };
    document.getElementById("row-show-translations").onclick = () => { Store.state.prefs.showTranslations = !Store.state.prefs.showTranslations; Store.save(); renderSettings(); renderCards(); };
    document.getElementById("row-show-diacritics").onclick = () => { Store.state.prefs.showDiacritics = !Store.state.prefs.showDiacritics; Store.save(); renderSettings(); renderCards(); };
    document.getElementById("row-haptic").onclick = () => { Store.state.prefs.hapticEnabled = !Store.state.prefs.hapticEnabled; Store.save(); renderSettings(); };

    // --- INITIALIZE ---
    renderFilters();
    renderCards();
    renderSettings();
  </script>
</body>
</html>
